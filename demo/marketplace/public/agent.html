<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent · CBA Agent Marketplace</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>◆</text></svg>">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <a class="wordmark" href="/">Agent<br>Marketplace</a>
    <div class="estate">Commonwealth Bank<br>of Australia,<br>internal</div>
    <nav>
      <a href="/">Catalogue</a>
      <a href="/instances">Instances</a>
      <a href="/new">Register</a>
    </nav>
    <div class="plane">Control plane</div>
  </div>
</header>

<main>
  <a class="back" href="/">← Back to the catalogue</a>
  <div id="notice" class="notice hidden"></div>
  <div id="body"><p class="loading"><span class="spinner"></span>Loading the agent…</p></div>
</main>

<script src="/app.js"></script>
<script>
const softwareId = decodeURIComponent(location.pathname.split('/agents/')[1] || '');
let doc = null;

function stepRow(s) {
  const refused = s.kind === 'refused';
  return `
    <div class="step${refused ? ' refused' : ''}">
      <div class="n">${String(s.n).padStart(2, '0')}</div>
      <div class="kind">${esc(refused ? 'refused' : s.kind)}</div>
      <div class="msg">${esc(s.message)}
        ${s.detail ? `<div class="detail">${esc(s.detail)}</div>` : ''}
      </div>
    </div>`;
}

let scenarioDefs = [];

function verdict(run) {
  if (!run) return '<span class="verdict none">not run</span>';
  return `<span class="verdict ${run.passed ? 'pass' : 'fail'}">${run.passed ? 'PASS' : 'FAIL'}</span>`;
}

function principalPanels() {
  if (doc.kind !== 'principal') return '';
  const d = doc.deploy || {};
  const runs = (doc.runs || []).filter((r) => r.scenario);
  const last = (id) => runs.slice().reverse().find((r) => r.scenario === id);
  return `
    <hr class="rule">
    <div class="section-head">
      <p class="eyebrow">In the federation</p>
      <div>
        <h2>Where this version stands</h2>
        <dl class="kv">
          <dt>workload</dt><dd class="plain">${esc(d.slot || '— (named on approval)')}</dd>
          <dt>entity id</dt><dd class="plain">${esc(d.entityId || '—')}</dd>
          <dt>SPIFFE ID</dt><dd class="plain">${esc(d.spiffeId || '—')}</dd>
        </dl>
        ${d.awaitingUpload ? `<div class="notice">Raidiam's API would not certify the bridge key. Upload its CSR in the Raidiam
          website - software statement <code>${esc(d.softwareStatementId)}</code>, certificates, <strong>rtssigning</strong> - then
          approve again to carry on:
          <a href="/api/agents/${encodeURIComponent(doc.softwareId)}/csr/bridge">bridge key CSR</a></div>` : ''}
        <div id="live-status" class="hint">${d.entityId ? '<span class="spinner"></span>Asking Raidiam and PingFederate…' : ''}</div>
      </div>
    </div>
    ${d.hosted || doc.status !== 'pending' ? `
    <hr class="rule">
    <div class="section-head">
      <p class="eyebrow">Scenarios</p>
      <div>
        <h2>What it can and cannot do</h2>
        <p style="margin:0 0 6px">Each runs the Principal agent as this version - a container SPIRE identifies as it - and is
          judged against what should happen. Every run is evidence on the Objectives page.</p>
        ${scenarioDefs.map((sc) => {
          const r = last(sc.id);
          const applicable = sc.when === doc.status;
          return `<div class="scenario">
            <div>
              <h3>${esc(sc.title)} ${verdict(r)}</h3>
              <div class="meta">${esc(sc.proves)}</div>
              <div class="meta">expects <code>${esc(sc.expect.outcome)}${sc.expect.refusedAt ? ` at ${sc.expect.refusedAt}` : ''}</code>
                · ${sc.objectives.map(esc).join(' ')}${r ? ` · last: <code>${esc(r.outcome)}${r.refusedAt ? ` at ${esc(r.refusedAt)}` : ''}</code> ${esc(when(r.at))}` : ''}</div>
              ${r && r.reason ? `<div class="meta">${esc(r.reason.slice(0, 220))}</div>` : ''}
              ${r && r.evidence && r.evidence.id ? `<div class="meta"><a href="/evidence/${esc(r.evidence.id)}" target="_blank">evidence pack</a> <code>${esc(r.evidence.sha256.slice(0, 16))}…</code></div>` : ''}
            </div>
            <div><button class="btn-sm" data-run="${esc(sc.id)}" ${applicable ? '' : 'disabled'} title="${applicable ? '' : `for a ${sc.when} version`}">Run</button></div>
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}
    ${runs.length ? `
    <hr class="rule">
    <div class="section-head">
      <p class="eyebrow">Runs</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>When</th><th>Scenario</th><th>Verdict</th><th>Outcome</th><th>Steps</th><th>Evidence</th></tr></thead>
          <tbody>${runs.slice().reverse().slice(0, 20).map((r) => `<tr>
            <td class="mono">${esc(when(r.at))}</td><td>${esc(r.title)}</td><td>${verdict(r)}</td>
            <td class="mono">${esc(r.outcome)}${r.refusedAt ? ` at ${esc(r.refusedAt)}` : ''}</td>
            <td class="mono" style="font-size:12px">${esc(Object.keys(r.steps || {}).join(' → '))}</td>
            <td>${r.evidence && r.evidence.id ? `<a href="/evidence/${esc(r.evidence.id)}" target="_blank">view</a> · <a href="/api/evidence/${esc(r.evidence.id)}">JSON</a>` : '—'}</td></tr>`).join('')}</tbody>
        </table>
      </div>
    </div>` : ''}`;
}

async function liveStatus() {
  const box = document.getElementById('live-status');
  if (!box || !(doc.deploy || {}).entityId) return;
  try {
    const st = await api.get(`/agents/${encodeURIComponent(softwareId)}/status`);
    const pf = st.pingfederate || {};
    const rd = st.raidiam || {};
    box.innerHTML = `<dl class="kv">
      <dt>Raidiam</dt><dd>${rd.served ? 'hosts its Entity Configuration' : 'does not serve its Entity Configuration'}; ${rd.vouches ? `vouches for it, with its bridge key (kid ${esc(rd.kids.bridge)})` : `does not vouch: ${esc(rd.error || 'its bridge key is not published')}`}</dd>
      <dt>PingFederate</dt><dd>${pf.registered ? `registered it from Raidiam at its first token (${esc(pf.at)})` : 'registers it from Raidiam at its first token'}</dd>
    </dl>`;
  } catch (err) {
    box.textContent = `Could not ask Raidiam: ${err.message}`;
  }
}

function render() {
  const r = doc.raidiam;
  const roles = doc.roles || [];
  const granted = new Set((r && r.rolesGranted) || []);

  const actions = [];
  if (doc.status === 'pending') {
    actions.push('<button class="btn-primary" data-act="approve">Approve and publish</button>');
  }
  if (doc.status === 'approved') {
    actions.push('<button class="btn-danger" data-act="suspend">Suspend</button>');
  }
  if (doc.status === 'suspended') {
    actions.push('<button class="btn-primary" data-act="approve">Reinstate</button>');
  }
  if (doc.status !== 'approved') {
    actions.push('<button class="btn-sm" data-act="remove">Remove from catalogue</button>');
  }

  document.getElementById('body').innerHTML = `
    <p class="eyebrow">${r ? 'Identity published by the marketplace' : 'Catalogue entry'}</p>
    <h1>${esc(doc.name)}</h1>
    <p class="sid" style="font-family:var(--mono);color:var(--quiet);margin:-6px 0 16px">${esc(doc.softwareId)}</p>
    <p class="lede">${esc(doc.description || 'No description recorded.')}</p>

    <div class="stat-row">
      <div class="stat"><div class="label">Owner</div><div class="value">${esc(doc.owner || doc.businessUnit || '—')}</div></div>
      <div class="stat"><div class="label">Status</div><div class="value">${pill(doc.status)}</div></div>
      <div class="stat"><div class="label">May ask for</div><div class="value">${roles.length} role${roles.length === 1 ? '' : 's'}</div></div>
      <div class="stat"><div class="label">Resolvable</div><div class="value${doc.status === 'approved' ? ' green' : ''}">${
        doc.status === 'approved' ? 'yes, through the CBA authority' : 'no'
      }</div></div>
    </div>

    <div class="actions" id="actions">${actions.join('')}</div>

    <hr class="rule">
    <div class="section-head">
      <p class="eyebrow">Who is accountable,<br>and for what</p>
      <div class="panel-grid">
        <div>
          <dl class="kv">
            <dt>version</dt><dd>${esc(doc.version || '—')}</dd>
            <dt>owner</dt><dd>${esc(doc.owner || '—')}</dd>
            <dt>business unit</dt><dd>${esc(doc.businessUnit || '—')}</dd>
            <dt>accountable owner</dt><dd>${esc(doc.accountableOwner || '—')}</dd>
            <dt>environment</dt><dd>${esc(doc.environment || '—')}</dd>
            <dt>capability</dt><dd>${esc(doc.capability || '—')}</dd>
            <dt>federation entity</dt><dd>${esc(doc.organisationId)}</dd>
            <dt>authenticates</dt><dd>${esc(doc.authorisationServerName || '—')}</dd>
          </dl>
        </div>
        <div>
          <h3>The evidence the catalogue holds</h3>
          <dl class="kv" style="grid-template-columns:150px 1fr">
            <dt>repository</dt><dd class="plain">${esc(doc.repository || '—')}</dd>
            <dt>bill of materials</dt><dd class="plain">${esc(doc.sbom || '—')}</dd>
          </dl>
          <h3 style="margin-top:22px">The roles it requests</h3>
          <div class="chips">
            ${roles.map((x) => `<span class="chip${granted.has(x) ? ' granted' : ''}">${esc(x)}</span>`).join('') || '<span class="chip">none</span>'}
          </div>
          ${granted.size ? '<p class="hint">Highlighted roles are granted on the software statement.</p>' : ''}
        </div>
      </div>
    </div>

    ${r ? `
    <hr class="rule">
    <div class="section-head">
      <p class="eyebrow">In the control plane</p>
      <div>
        <h2>What the control plane issued</h2>
        <p style="margin:0 0 18px">
          A record, a certificate and the roles that make the capability grant. Read back after
          writing, because a write nobody checked is not evidence.
        </p>
        <dl class="kv">
          <dt>entity id</dt><dd class="plain">${esc(r.entityId)}</dd>
          <dt>software statement</dt><dd class="plain">${esc(r.softwareStatementId)}</dd>
          <dt>signs with</dt><dd class="plain">${esc(r.signingKid || '—')}</dd>
          <dt>statement status</dt><dd>${esc(r.statementStatus || '—')}</dd>
          <dt>published by</dt><dd class="plain">this marketplace, on the agent's behalf</dd>
          <dt>published at</dt><dd class="plain">${esc(when(r.publishedAt))}</dd>
          <dt>mode</dt><dd class="plain">${esc(r.mode)}</dd>
        </dl>
      </div>
    </div>` : ''}

    ${principalPanels()}
    ${(doc.steps || []).length ? `
    <hr class="rule">
    <div class="section-head">
      <p class="eyebrow">Live</p>
      <div>
        <h2>What the control plane did</h2>
        <p style="margin:0">
          Each line is one call and its answer, in the order they happened. A step that was
          refused is shown as a refusal, because a refusal nobody can see is indistinguishable
          from a request that was never made.
        </p>
      </div>
    </div>
    <div class="log">
      <div class="log-head">
        <strong>This deployment</strong>
        <span class="done">${doc.status === 'approved' ? 'done' : esc(doc.status)}</span>
      </div>
      ${doc.steps.slice(-60).map(stepRow).join('')}
    </div>` : ''}

    <hr class="rule">
    <div class="section-head">
      <p class="eyebrow">Lifecycle</p>
      <div>
        <h2>Every decision on this record</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>When</th><th>Action</th><th>Actor</th><th>Note</th></tr></thead>
            <tbody>
              ${(doc.history || [])
                .slice()
                .reverse()
                .map(
                  (h) => `<tr>
                    <td class="mono">${esc(when(h.at))}</td>
                    <td class="mono">${esc(h.action)}</td>
                    <td class="mono">${esc(h.actor)}</td>
                    <td>${esc(h.note || '—')}</td>
                  </tr>`
                )
                .join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;
  const box = document.getElementById('notice');
  box.classList.add('hidden');

  if (act === 'remove' && !confirm('Remove this agent from the catalogue?')) return;
  if (act === 'suspend' && !confirm('Suspend this agent? Its identity will be set to Inactive in the control plane.')) return;

  const label = btn.textContent;
  document.querySelectorAll('[data-act]').forEach((b) => (b.disabled = true));
  btn.innerHTML = '<span class="spinner"></span>Working…';

  try {
    if (act === 'remove') {
      await api.del(`/agents/${encodeURIComponent(softwareId)}`);
      location.href = '/';
      return;
    }
    doc = await api.post(`/agents/${encodeURIComponent(softwareId)}/${act}`);
    render();
    liveStatus();
    notice(
      document.getElementById('notice'),
      act === 'approve'
        ? (doc.kind === 'principal' ? 'Deployed. Raidiam hosts its statement, certificate and roles; its bridge key is in the KMS.' : 'Approved. The software statement is live in the control plane.')
        : 'Suspended. The software statement is Inactive in the control plane.',
      'ok'
    );
  } catch (err) {
    notice(box, err.message);
    // The log holds what the control plane did before it stopped.
    doc = await api.get(`/agents/${encodeURIComponent(softwareId)}`).catch(() => doc);
    render();
    liveStatus();
  }
});

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-run]');
  if (!btn) return;
  const box = document.getElementById('notice');
  box.classList.add('hidden');
  document.querySelectorAll('[data-run]').forEach((b) => (b.disabled = true));
  btn.innerHTML = '<span class="spinner"></span>Running…';
  try {
    const r = await api.post(`/agents/${encodeURIComponent(softwareId)}/run`, { scenario: btn.dataset.run });
    notice(box, `${r.title}: ${r.passed ? 'PASS' : 'FAIL'} - ${r.outcome}${r.refusedAt ? ` at ${r.refusedAt}` : ''}${r.reason ? ` (${r.reason.slice(0, 200)})` : ''}`, r.passed ? 'ok' : 'error');
  } catch (err) {
    notice(box, err.message);
  }
  doc = await api.get(`/agents/${encodeURIComponent(softwareId)}`);
  render();
  liveStatus();
});

(async () => {
  try {
    [doc, { scenarios: scenarioDefs }] = await Promise.all([
      api.get(`/agents/${encodeURIComponent(softwareId)}`), api.get('/scenarios')]);
    render();
    liveStatus();
    if (new URLSearchParams(location.search).get('created')) {
      notice(
        document.getElementById('notice'),
        'Registered. The agent is pending: approve it to create its identity in the control plane.',
        'ok'
      );
    }
  } catch (err) {
    document.getElementById('body').innerHTML = '';
    notice(document.getElementById('notice'), `Could not load this agent: ${err.message}`);
  }
})();
</script>
</body>
</html>
