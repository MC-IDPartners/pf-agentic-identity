# The SPIRE workload against the raidiam rig (PF_PROFILE=raidiam ../up.sh). One service, three flows:
#
#   docker compose run --rm workload                                       # AUTH_MODE=attestation (default)
#   docker compose run --rm -e AUTH_MODE=federation workload               # trust chain in the client assertion
#   docker compose run --rm -e AUTH_MODE=federation-discovery workload     # PingFederate resolves the chain
#
# It needs a running SPIRE agent whose Workload API socket is in the named volume SPIRE_SOCKETS_VOLUME (default
# spire_spire-agent-sockets: the agent of a compose project called "spire"), and a registration entry selecting
# this container (docker:label:app:my-workload -> spiffe://example.org/my-workload). The federation flows need
# ENTITY_KEY_FILE's key certified by Raidiam for ENTITY_ID (see ../raidiam/README.md); the attestation flow needs
# neither.
services:
  workload:
    build: .
    restart: "no"
    labels:
      app: my-workload
    environment:
      # The authorisation server comes from the Raidiam directory. Its Issuer is the rig's PF_BASE_URL; this
      # container reaches PingFederate on the Docker host instead.
      DIRECTORY_URL: ${DIRECTORY_URL:-https://data.directory.cba.raidiam.io}
      AUTHORISATION_SERVER_ID: ${AUTHORISATION_SERVER_ID:-9b0983ce-781e-4f58-8620-0a752aafa054}
      ISSUER_HOST_OVERRIDE: host.docker.internal:${PF_PORT_HTTPS:-9031}
      AUTH_MODE: ${AUTH_MODE:-attestation}
      # The federation flows: the workload's Entity Identifier (the ClientId on its Raidiam software statement),
      # its key, its superior and the anchor PingFederate pins.
      ENTITY_ID: ${ENTITY_ID:-https://localhost/agent/my-workload}
      ENTITY_KEY_FILE: /keys/entity.jwk
      AUTHORITY_HINT: ${AUTHORITY_HINT:-https://authority.directory.cba.raidiam.io/authority/5a27c88b-97ed-4d37-a3c8-59c66b19aa25}
      TRUST_ANCHOR: ${TRUST_ANCHOR:-https://federation.directory.cba.raidiam.io/federation_entity/ff726945-ebd7-45e2-9869-c11227669433}
      # The attestation flow: what the instance asks for, held to the client's attestation_entitlement ceiling.
      SPIRE_SOCKET: /run/spire/sockets/agent.sock
      PROOF_MODE: pop
      AUTHORIZATION_DETAILS: '[{"type":"sales_agent","sales_regions":["EMEA"]}]'
      # PingFederate's runtime certificate is issued by the rig's own CA (../gen-keys.sh).
      PF_CA_FILE: /certs/pf-runtime-tls-ca.crt
      SSL_CERT_FILE: /certs/pf-runtime-tls-ca.crt
    volumes:
      - ../keys/pf-runtime-tls-ca.crt:/certs/pf-runtime-tls-ca.crt:ro
      - spire-sockets:/run/spire/sockets
      - ./keys:/keys

  # An instance of the federated attested client: the attestation flow under the SPIFFE ID the entity host binds,
  # so the attester takes its client from that entity, validated through Raidiam, not from PingFederate's clients.
  #   docker compose run --rm attested-workload
  attested-workload:
    extends: workload
    labels:
      app: spire-client
    environment:
      AUTH_MODE: attestation
      # Optional: name the client at mint; the attester still checks the SVID against that client's bindings.
      ATTESTATION_CLIENT_ID: ${ATTESTED_CLIENT_ID:-https://host.docker.internal:8443/agent/spire-client}
      # With an agent provider (RAIDIAM_PROVIDER_ID) the attestations are the provider's, and the attester wants the
      # JWT-SVID addressed to it; unset, the audience is PingFederate's issuer, from its discovery document.
      EVIDENCE_AUDIENCE: ${RAIDIAM_PROVIDER_ID:-}

  # SPIRE's OIDC Discovery Provider (spire-oidc.conf): the trust domain's live JWT-SVID keys at
  # https://host.docker.internal:8445/keys, the bundle_url the federated client's bindings name. Needs a SPIRE entry
  # spiffe://example.org/spire-oidc <- docker:label:app:spire-oidc, and its certificate from the rig's CA
  # (keys/raidiam/spire-oidc/, see ../raidiam/README.md).
  #   docker compose up -d spire-oidc
  spire-oidc:
    image: ghcr.io/spiffe/oidc-discovery-provider:1.9.0
    command: ["-config", "/run/spire-oidc/oidc.conf"]
    restart: unless-stopped
    labels:
      app: spire-oidc
    ports:
      - "8445:8445"
    volumes:
      - ./spire-oidc.conf:/run/spire-oidc/oidc.conf:ro
      - ../keys/raidiam/spire-oidc/tls.crt:/run/spire-oidc/tls.crt:ro
      - ../keys/raidiam/spire-oidc/tls.key:/run/spire-oidc/tls.key:ro
      - spire-sockets:/run/spire/sockets

  # The federated attested client's owner (../raidiam/README.md, "Attestation from a federation entity"): serves its
  # Entity Configuration with spiffe_client_bindings at ATTESTED_CLIENT_ID, which PingFederate's attester resolves
  # (OIDF_ATTESTER_FEDERATION_ENTITY), and keeps the client registered at PingFederate.
  #   docker compose up -d entity-host
  entity-host:
    build: .
    command: ["python", "workload.py", "entity-host"]
    restart: unless-stopped
    # Not published: gateway-provider (Kong) is https://host.docker.internal:8443 and passes everything but the agents'
    # MCP through to here.
    environment:
      DIRECTORY_URL: ${DIRECTORY_URL:-https://data.directory.cba.raidiam.io}
      AUTHORISATION_SERVER_ID: ${AUTHORISATION_SERVER_ID:-9b0983ce-781e-4f58-8620-0a752aafa054}
      ISSUER_HOST_OVERRIDE: host.docker.internal:${PF_PORT_HTTPS:-9031}
      # The ClientId of the client's Raidiam software statement; PingFederate fetches its configuration here.
      ENTITY_ID: ${ATTESTED_CLIENT_ID:-https://host.docker.internal:8443/agent/spire-client}
      ENTITY_LISTEN_PORT: "8443"
      ENTITY_KEY_FILE: /keys/entity.private.jwk.json
      CLIENT_JWKS_FILE: /keys/bridge.public.jwks.json
      ENTITY_TLS_CERT: /keys/entity-host-tls.crt
      ENTITY_TLS_KEY: /keys/entity-host-tls.key
      AUTHORITY_HINT: ${AUTHORITY_HINT:-https://authority.directory.cba.raidiam.io/authority/5a27c88b-97ed-4d37-a3c8-59c66b19aa25}
      CLIENT_NAME: Principal Agent (POC)
      # Its own SPIFFE identity: one bound to two clients is refused at issuance (instance identity is bound to more
      # than one client). SPIRE needs an entry: spiffe://example.org/spire-client <- docker:label:app:spire-client.
      SPIFFE_IDS: ${SPIFFE_IDS:-spiffe://example.org/spire-client}
      TRUST_DOMAIN: ${TRUST_DOMAIN:-example.org}
      # The trust domain's live JWT-SVID keys (spire-oidc); unset, the copy below is published instead.
      SPIRE_BUNDLE_URL: ${SPIRE_BUNDLE_URL-https://host.docker.internal:8445/keys}
      SPIRE_BUNDLE_FILE: /spire/spire-bundle.jwks.json
      PF_CA_FILE: /certs/pf-runtime-tls-ca.crt
      # The agent provider (../raidiam/provider.sh; its own Raidiam software statement): when set, this host also
      # serves the provider's Entity Configuration at PROVIDER_ID, publishing the attester's key, and the client's
      # bindings name the provider as the attestations' issuer. up.sh needs the same RAIDIAM_PROVIDER_ID.
      PROVIDER_ID: ${RAIDIAM_PROVIDER_ID-}
      PROVIDER_KEY_FILE: /provider/entity.private.jwk.json
      ATTESTER_JWKS_FILE: /provider/attester.public.jwks.json
      # The provider's /attest (the agent-r flow): it signs attestations itself with this key.
      ATTESTER_PRIVATE_FILE: /provider/attester.private.jwk.json
      # Agents calling agents (../gateway/README.md): the provider's sub-agents, <provider>/agent/<name>, each a client
      # and a resource other agents call; keys under ../keys/raidiam/agents/<name>/ (AGENT=<name> attested-client.sh).
      HOSTED_AGENTS: ${RAIDIAM_HOSTED_AGENTS-accounts-agent payments-agent}
      AGENT_CAPABILITIES: accounts-agent=accounts_read,payments-agent=payment_initiation
    volumes:
      - ../keys/pf-runtime-tls-ca.crt:/certs/pf-runtime-tls-ca.crt:ro
      - ../keys/raidiam/attested-client:/keys:ro
      - ../keys/raidiam/provider:/provider:ro
      - ../keys/raidiam/agents:/agents:ro
      - ../keys/raidiam/spire-bundle.jwks.json:/spire/spire-bundle.jwks.json:ro

  # The agent-r flow (../raidiam/README.md, "The agent-r flow"): an agent that is handed only its identifier, gets
  # this copy attested by its provider (entity-host's /attest, on SPIRE's word), reads its capabilities and finds a
  # resource through the federation, and calls it with a token from PingFederate. Needs entity-host (with
  # RAIDIAM_PROVIDER_ID), spire-oidc and rs-accounts up, and PingFederate started with RAIDIAM_RESOURCE_ID.
  #   docker compose run --rm agent [list-accounts | get-balance]
  agent:
    build: .
    restart: "no"
    entrypoint: ["python", "agent.py"]
    command: []
    labels:
      app: spire-client
    environment:
      AGENT_ID: ${ATTESTED_CLIENT_ID:-https://host.docker.internal:8443/agent/spire-client}
      AGENT_PROVIDER: ${RAIDIAM_PROVIDER_ID:-https://host.docker.internal:8443}
      AUTHORITY: ${AUTHORITY_HINT:-https://authority.directory.cba.raidiam.io/authority/5a27c88b-97ed-4d37-a3c8-59c66b19aa25}
      TRUST_ANCHOR: ${TRUST_ANCHOR:-https://federation.directory.cba.raidiam.io/federation_entity/ff726945-ebd7-45e2-9869-c11227669433}
      TRUST_ANCHOR_ENV_FILE: /fed/vars.raidiam.env
      # The network's own resources, which Raidiam cannot reach and so does not list.
      # ...and the agents it may call (agents calling agents), which Raidiam cannot list either.
      RESOURCE_IDS: ${RAIDIAM_RESOURCE_ID:-https://host.docker.internal:8446},${RAIDIAM_PAYMENTS_RESOURCE_ID:-https://host.docker.internal:8447},${RAIDIAM_PROVIDER_ID:-https://host.docker.internal:8443}/agent/accounts-agent,${RAIDIAM_PROVIDER_ID:-https://host.docker.internal:8443}/agent/payments-agent
      INVOICE_AMOUNT: ${INVOICE_AMOUNT:-420}
      DIRECTORY_URL: ${DIRECTORY_URL:-https://data.directory.cba.raidiam.io}
      AUTHORISATION_SERVER_ID: ${AUTHORISATION_SERVER_ID:-9b0983ce-781e-4f58-8620-0a752aafa054}
      ISSUER_HOST_OVERRIDE: host.docker.internal:${PF_PORT_HTTPS:-9031}
      SPIRE_SOCKET: /run/spire/sockets/agent.sock
      INSTANCE_KEY_FILE: /state/instance.jwk
      PF_CA_FILE: /certs/pf-runtime-tls-ca.crt
    volumes:
      - ../keys/pf-runtime-tls-ca.crt:/certs/pf-runtime-tls-ca.crt:ro
      - ../vars.raidiam.env:/fed/vars.raidiam.env:ro
      - spire-sockets:/run/spire/sockets
      - agent-state:/state

  # The agent-r flow's resource: an MCP server in the protected network, a federation entity of its own (its own
  # Raidiam software statement, RAIDIAM_RESOURCE_ID; key from ../raidiam/resource.sh), protected by PingFederate.
  #   docker compose up -d rs-accounts
  #
  # It sits behind the gateway (below): the gateway listens at its identifier, https://host.docker.internal:8446, and
  # this serves plain HTTP inside the compose network only. It still makes its own checks - token, federation
  # membership, capability - should anything reach it past the gateway.
  rs-accounts:
    build: .
    command: ["python", "rs_accounts.py"]
    restart: unless-stopped
    environment:
      RESOURCE_ID: ${RAIDIAM_RESOURCE_ID:-https://host.docker.internal:8446}
      RESOURCE_KEY_FILE: /keys/entity.private.jwk.json
      AUTHORITY_HINT: ${AUTHORITY_HINT:-https://authority.directory.cba.raidiam.io/authority/5a27c88b-97ed-4d37-a3c8-59c66b19aa25}
      TRUST_ANCHOR: ${TRUST_ANCHOR:-https://federation.directory.cba.raidiam.io/federation_entity/ff726945-ebd7-45e2-9869-c11227669433}
      TRUST_ANCHOR_ENV_FILE: /fed/vars.raidiam.env
      DIRECTORY_URL: ${DIRECTORY_URL:-https://data.directory.cba.raidiam.io}
      AUTHORISATION_SERVER_ID: ${AUTHORISATION_SERVER_ID:-9b0983ce-781e-4f58-8620-0a752aafa054}
      ISSUER_HOST_OVERRIDE: host.docker.internal:${PF_PORT_HTTPS:-9031}
      REQUIRED_CAPABILITY: accounts_read
      PF_CA_FILE: /certs/pf-runtime-tls-ca.crt
      RESOURCE_LISTEN_PORT: "8446"
      # The PEP reads tools/list from here by its compose name; the gateway rewrites Host to rs-accounts.
      RESOURCE_ALLOWED_HOSTS: rs-accounts:8446,rs-accounts
    volumes:
      - ../keys/pf-runtime-tls-ca.crt:/certs/pf-runtime-tls-ca.crt:ro
      - ../vars.raidiam.env:/fed/vars.raidiam.env:ro
      - ../keys/raidiam/rs-accounts:/keys:ro

  # rs-payments: the same server, RESOURCE_KIND=payments (pay_invoice, payment_initiation), behind gateway-payments at
  # https://host.docker.internal:8447. Its own Raidiam software statement and ApiResource; keys RESOURCE=rs-payments.
  rs-payments:
    build: .
    command: ["python", "rs_accounts.py"]
    restart: unless-stopped
    environment:
      RESOURCE_KIND: payments
      RESOURCE_ID: ${RAIDIAM_PAYMENTS_RESOURCE_ID:-https://host.docker.internal:8447}
      RESOURCE_KEY_FILE: /keys/entity.private.jwk.json
      AUTHORITY_HINT: ${AUTHORITY_HINT:-https://authority.directory.cba.raidiam.io/authority/5a27c88b-97ed-4d37-a3c8-59c66b19aa25}
      TRUST_ANCHOR: ${TRUST_ANCHOR:-https://federation.directory.cba.raidiam.io/federation_entity/ff726945-ebd7-45e2-9869-c11227669433}
      TRUST_ANCHOR_ENV_FILE: /fed/vars.raidiam.env
      DIRECTORY_URL: ${DIRECTORY_URL:-https://data.directory.cba.raidiam.io}
      AUTHORISATION_SERVER_ID: ${AUTHORISATION_SERVER_ID:-9b0983ce-781e-4f58-8620-0a752aafa054}
      ISSUER_HOST_OVERRIDE: host.docker.internal:${PF_PORT_HTTPS:-9031}
      PF_CA_FILE: /certs/pf-runtime-tls-ca.crt
      RESOURCE_LISTEN_PORT: "8446"
      RESOURCE_ALLOWED_HOSTS: rs-payments:8446,rs-payments
    volumes:
      - ../keys/pf-runtime-tls-ca.crt:/certs/pf-runtime-tls-ca.crt:ro
      - ../vars.raidiam.env:/fed/vars.raidiam.env:ro
      - ../keys/raidiam/rs-payments:/keys:ro

  # The provider's sub-agents (sub_agent.py): MCP servers other agents call, behind gateway-provider at
  # <provider>/agent/<name>/mcp/v1. Each exchanges its caller's token (RFC 8693) for one at its resource and calls
  # it. Each runs under its own SPIRE identity: spiffe://example.org/<name> <- docker:label:app:<name>.
  accounts-agent:
    build: .
    command: ["python", "sub_agent.py"]
    restart: unless-stopped
    labels:
      app: accounts-agent
    environment: &sub-agent-env
      AGENT_KIND: accounts
      AGENT_ID: ${RAIDIAM_PROVIDER_ID:-https://host.docker.internal:8443}/agent/accounts-agent
      AGENT_PROVIDER: ${RAIDIAM_PROVIDER_ID:-https://host.docker.internal:8443}
      DOWNSTREAM_RESOURCE: ${RAIDIAM_RESOURCE_ID:-https://host.docker.internal:8446}
      AUTHORISATION_SERVER: ${PF_BASE_URL:-https://bottle-platonic-parted.ngrok-free.dev}
      ISSUER_HOST_OVERRIDE: host.docker.internal:${PF_PORT_HTTPS:-9031}
      PF_CA_FILE: /certs/pf-runtime-tls-ca.crt
      SPIRE_SOCKET: /run/spire/sockets/agent.sock
      INSTANCE_KEY_FILE: /state/instance.jwk
      LISTEN_PORT: "8090"
      AGENT_ALLOWED_HOSTS: accounts-agent:8090,accounts-agent
    volumes:
      - ../keys/pf-runtime-tls-ca.crt:/certs/pf-runtime-tls-ca.crt:ro
      - spire-sockets:/run/spire/sockets
      - accounts-agent-state:/state

  payments-agent:
    build: .
    command: ["python", "sub_agent.py"]
    restart: unless-stopped
    labels:
      app: payments-agent
    environment:
      <<: *sub-agent-env
      AGENT_KIND: payments
      AGENT_ID: ${RAIDIAM_PROVIDER_ID:-https://host.docker.internal:8443}/agent/payments-agent
      DOWNSTREAM_RESOURCE: ${RAIDIAM_PAYMENTS_RESOURCE_ID:-https://host.docker.internal:8447}
      AGENT_ALLOWED_HOSTS: payments-agent:8090,payments-agent
    volumes:
      - ../keys/pf-runtime-tls-ca.crt:/certs/pf-runtime-tls-ca.crt:ro
      - spire-sockets:/run/spire/sockets
      - payments-agent-state:/state

  # Kong as the provider's edge, https://host.docker.internal:8443: the sub-agents' MCP through coaz-pep, everything
  # else (Entity Configurations, /attest, /agents) to entity-host.
  gateway-provider:
    build: ../gateway/kong
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      KONG_TEMPLATE: provider.yml.template
      KONG_PROXY_LISTEN: "0.0.0.0:8443 ssl"
      PROVIDER_ID: ${RAIDIAM_PROVIDER_ID:-https://host.docker.internal:8443}
      PROVIDER_URL: https://entity-host:8443
      COAZ_URL: http://coaz-pep:9192
    volumes:
      - ../keys/raidiam/attested-client/entity-host-tls.crt:/tls/tls.crt:ro
      - ../keys/raidiam/attested-client/entity-host-tls.key:/tls/tls.key:ro
    depends_on: [entity-host, coaz-pep]

  # Kong in front of rs-payments, at https://host.docker.internal:8447.
  gateway-payments:
    build: ../gateway/kong
    restart: unless-stopped
    ports:
      - "8447:8447"
    environment:
      KONG_PROXY_LISTEN: "0.0.0.0:8447 ssl"
      RESOURCE_ID: ${RAIDIAM_PAYMENTS_RESOURCE_ID:-https://host.docker.internal:8447}
      RESOURCE_URL: http://rs-payments:8446
      RESOURCE_LABEL: rs-payments MCP
      COAZ_URL: http://coaz-pep:9192
    volumes:
      - ../keys/raidiam/attested-client/entity-host-tls.crt:/tls/tls.crt:ro
      - ../keys/raidiam/attested-client/entity-host-tls.key:/tls/tls.key:ro
    depends_on: [rs-payments, coaz-pep]

  # The gateway in front of rs-accounts (../gateway/README.md): Kong, at the resource's identifier, asks coaz-pep about
  # every MCP request (its HTTP check API); only then does a call reach the resource.
  gateway:
    build: ../gateway/kong
    restart: unless-stopped
    ports:
      - "8446:8446"
    environment:
      RESOURCE_ID: ${RAIDIAM_RESOURCE_ID:-https://host.docker.internal:8446}
      RESOURCE_URL: http://rs-accounts:8446
      COAZ_URL: http://coaz-pep:9192
    volumes:
      - ../keys/raidiam/attested-client/entity-host-tls.crt:/tls/tls.crt:ro
      - ../keys/raidiam/attested-client/entity-host-tls.key:/tls/tls.key:ro
    depends_on: [rs-accounts, coaz-pep]

  # The policy enforcement point (vendored from idp-agentic-demo): Kong's plugin asks its HTTP check API. It verifies the
  # access token (PingFederate's JWKS, fetched inside the network), then for an MCP tools/call reads the tool's
  # x-coaz-mapping and asks the PDP an AuthZEN question. Fails closed.
  coaz-pep:
    build: ../gateway/coaz-pep
    restart: unless-stopped
    environment:
      AUTHZEN_URL: http://pingauthorize:1080
      AUTHZEN_API_KEY: rig-authzen-dev-key
      TOKEN_JWKS_URL: https://host.docker.internal:${PF_PORT_HTTPS:-9031}/pf/JWKS
      TOKEN_ISSUER: ${PF_BASE_URL:-https://bottle-platonic-parted.ngrok-free.dev}
      TOKEN_AUDIENCE: ${RAIDIAM_RESOURCE_ID:-https://host.docker.internal:8446}
      TOKEN_CA_FILE: /certs/pf-runtime-tls-ca.crt
      # Shared Signals: a poll stream from PingFederate's transmitter, as rig-pep-ssf-receiver (../terraform/ssf-pep.tf).
      # A session-revoked or account-disabled about an agent refuses its tokens here within a poll.
      SSF_CONFIGURATION_URL: https://host.docker.internal:${PF_PORT_HTTPS:-9031}/.well-known/ssf-configuration
      SSF_CONNECT_BASE: https://host.docker.internal:${PF_PORT_HTTPS:-9031}
      SSF_TOKEN_ENDPOINT: https://host.docker.internal:${PF_PORT_HTTPS:-9031}/as/token.oauth2
      SSF_CLIENT_ID: rig-pep-ssf-receiver
      SSF_CLIENT_KEY_FILE: /keys/pep-ssf.private.jwk.json
      SSF_POLL_SECONDS: "2"
    volumes:
      - ../keys/pf-runtime-tls-ca.crt:/certs/pf-runtime-tls-ca.crt:ro
      - ../keys/gateway/pep-ssf.private.jwk.json:/keys/pep-ssf.private.jwk.json:ro
    depends_on: [pingauthorize]

  # The policy administration point: PingAuthorize Policy Editor 11.1 (the PDP's version). The rig's policy is authored
  # here through its API (../gateway/pingauthorize/author-policy.py) and the PDP reads the committed branch live
  # (external mode). The UI, for looking: https://localhost:8448 (demo-mode sign-in).
  pingauthorize-pap:
    image: pingidentity/pingauthorizepap:11.1.0.0-latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8448:1443"
    environment:
      PING_IDENTITY_ACCEPT_EULA: "YES"
      PING_EXTERNAL_BASE_URL: localhost:8448
      DECISION_POINT_SHARED_SECRET: rig-pap-dev-secret
    env_file:
      - path: ${PING_DEVOPS_CONFIG:-${HOME}/.pingidentity/config}

  # The policy decision point: PingAuthorize 11.1, its embedded PDP behind the AuthZEN servlet. Not published on the
  # host. Takes a few minutes to set up on first start (licence fetch, server profile).
  pingauthorize:
    build: ../gateway/pingauthorize
    restart: unless-stopped
    env_file:
      - path: ${PING_DEVOPS_CONFIG:-${HOME}/.pingidentity/config}

volumes:
  agent-state:
  accounts-agent-state:
  payments-agent-state:
  spire-sockets:
    external: true
    name: ${SPIRE_SOCKETS_VOLUME:-spire_spire-agent-sockets}
