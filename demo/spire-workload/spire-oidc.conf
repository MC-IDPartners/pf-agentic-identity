# SPIRE's OIDC Discovery Provider: the trust domain's current JWT-SVID signing keys, served as a JWKS (use "sig")
# at https://host.docker.internal:8445/keys. The federated attested client's Entity Configuration names that URL as
# its bundle_url, so PingFederate's attester verifies each JWT-SVID against the keys SPIRE holds now, fetched live
# (cached 300 s), rather than a copy pasted in. It reads them through the SPIRE agent's Workload API, as the
# workload spiffe://example.org/spire-oidc (a registration entry selecting docker:label:app:spire-oidc).
log_level = "INFO"
domains = ["host.docker.internal", "localhost"]

serving_cert_file {
  cert_file_path = "/run/spire-oidc/tls.crt"
  key_file_path  = "/run/spire-oidc/tls.key"
  addr           = ":8445"
}

workload_api {
  socket_path  = "/run/spire/sockets/agent.sock"
  trust_domain = "example.org"
}
